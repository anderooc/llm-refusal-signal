name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check src tests

      - name: Test
        run: pytest --cov --cov-report=term-missing

      # Guards the headline claim: the committed responses must still produce the
      # metrics reported in the paper.
      - name: Verify published metrics reproduce
        run: refusal-signal replay

      - name: Fail if regenerated figures were not committed
        run: git diff --exit-code --stat -- results/

  notebook:
    name: Notebook executes offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]' nbclient ipykernel

      - name: Execute walkthrough
        run: |
          jupyter kernelspec list || true
          python -m nbclient notebooks/walkthrough.ipynb --timeout 300
